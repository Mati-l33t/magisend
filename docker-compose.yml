services:
  magisend:
    image: ghcr.io/mati-l33t/magisend:latest
    container_name: magisend
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - magisend_data:/data
      # Optional: a NAS share mounted on the host, added in Administration →
      # Storage locations as /mnt/share.
      # - /mnt/nas/magisend:/mnt/share
    environment:
      # Public address when served through a reverse proxy with HTTPS, e.g.
      # MAGISEND_PUBLIC_ORIGIN: https://share.example.com
      MAGISEND_PUBLIC_ORIGIN: ''
      # Address(es) of that reverse proxy, so rate limits see real visitors.
      MAGISEND_TRUSTED_PROXIES: ''
      # The first administrator account needs a one-time setup code, shown in
      # the log (docker compose logs magisend). To choose it yourself instead:
      # MAGISEND_SETUP_CODE: pick-a-long-code

volumes:
  magisend_data:
