name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run check:locales
          npm test
          npm run build
          npm run check:e2e
      - name: Backend checks
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -timeout 600s ./...
      - name: Shell scripts
        run: shellcheck -S warning install.sh proxmox/install.sh deploy/update.sh scripts/build-release.sh

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
