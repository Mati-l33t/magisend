name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Nothing is built or published unless the full test suite passes for the
  # tagged commit.
  tests:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: tests
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release archive
        run: |
          scripts/build-release.sh "$GITHUB_REF_NAME" "${{ matrix.arch }}"
          mv dist-release/SHA256SUMS "dist-release/SHA256SUMS.${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist-release/

  github-release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true
      # A draft until the maintainer signs SHA256SUMS with the release key,
      # which is kept off GitHub, and publishes it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          cat SHA256SUMS.* > SHA256SUMS && rm SHA256SUMS.*
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v {on=1; next} /^## / && on {exit} on' ../CHANGELOG.md > notes.md
          echo -e "\n**Install or update:** see the [README](https://github.com/${GITHUB_REPOSITORY}#install)." >> notes.md
          gh release create "$GITHUB_REF_NAME" magisend_*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "MagiSend $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --draft
