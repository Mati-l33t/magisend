name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Nothing is built or published unless the full test suite passes for the
  # tagged commit.
  tests:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: tests
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build release archive
        run: |
          scripts/build-release.sh "$GITHUB_REF_NAME" "${{ matrix.arch }}"
          mv dist-release/SHA256SUMS "dist-release/SHA256SUMS.${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist-release/

  github-release:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true
      # A draft until the maintainer signs SHA256SUMS with the release key,
      # which is kept off GitHub, and publishes it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-release
          cat SHA256SUMS.* > SHA256SUMS && rm SHA256SUMS.*
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v {on=1; next} /^## / && on {exit} on' ../CHANGELOG.md > notes.md
          echo -e "\n**Install or update:** see the [README](https://github.com/${GITHUB_REPOSITORY}#install)." >> notes.md
          gh release create "$GITHUB_REF_NAME" magisend_*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "MagiSend $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --draft

  docker:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/magisend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
